version: '3.8'

networks:
  localnet:
    driver: bridge

services:
  db:
    image: postgres:13
    networks:
      localnet:
        aliases:
          - db.internal
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:latest
    networks:
      localnet:
        aliases:
          - vault.internal
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroot"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      - vault
    networks:
      localnet:
    environment:
      VAULT_ADDR: "http://vault.internal:8200"
      VAULT_TOKEN: "myroot"
    command:
      - "sh"
      - "-c"
      - |
        sleep 5
        vault secrets enable -path=secret kv-v2
        vault kv put secret/db_credentials username=myuser password=mypassword
        echo "Секреты успешно загружены в Vault!"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    networks:
      localnet:
        aliases:
          - zookeeper.internal
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    networks:
      localnet:
        aliases:
          - kafka.internal
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper.internal:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka.internal:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  model_app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - kafka
    networks:
      localnet:
    environment:
      KAFKA_BROKER: "kafka.internal:29092"
      NO_PROXY: "vault.internal,db.internal,kafka.internal,zookeeper.internal,localhost,127.0.0.1"
      no_proxy: "vault.internal,db.internal,kafka.internal,zookeeper.internal,localhost,127.0.0.1"

  consumer_app:
    build: .
    command: ["python", "-u", "consumer.py"]
    depends_on:
      vault-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      localnet:
    environment:
      PYTHONUNBUFFERED: 1
      VAULT_ADDR: "http://vault.internal:8200"
      VAULT_TOKEN: "myroot"
      DB_HOST: "db.internal"
      POSTGRES_DB: "mydb"
      KAFKA_BROKER: "kafka.internal:29092"
      NO_PROXY: "vault.internal,db.internal,kafka.internal,zookeeper.internal,localhost,127.0.0.1"
      no_proxy: "vault.internal,db.internal,kafka.internal,zookeeper.internal,localhost,127.0.0.1"