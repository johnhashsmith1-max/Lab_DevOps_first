services:
  db:
    container_name: lab3_db
    image: postgres:13
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    container_name: lab3_vault
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroot"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK

  vault-init:
    container_name: lab3_vault_init
    image: hashicorp/vault:latest
    depends_on:
      - vault
    environment:
      # Обращаемся по новому жесткому имени
      VAULT_ADDR: "http://lab3_vault:8200"
      VAULT_TOKEN: "myroot"
    command:
      - "sh"
      - "-c"
      - |
        sleep 5
        vault secrets enable -path=secret kv-v2
        vault kv put secret/db_credentials username=myuser password=mypassword
        echo "Секреты успешно загружены в Vault!"

  model_app:
    container_name: lab3_model_app
    build: .
    ports:
      - "8000:8000"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      # Задаем новые пути для переменных
      VAULT_ADDR: "http://lab3_vault:8200"
      VAULT_TOKEN: "myroot"
      DB_HOST: "lab3_db"
      POSTGRES_DB: "mydb"