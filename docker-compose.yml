services:
  pgdatabase:
    image: postgres:13
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5

  vaultserver:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "myroot"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"

  vaultinit:
    image: hashicorp/vault:latest
    depends_on:
      - vaultserver
    environment:
      VAULT_ADDR: "http://vaultserver:8200"
      VAULT_TOKEN: "myroot"
    command:
      - "sh"
      - "-c"
      - |
        sleep 5
        vault secrets enable -path=secret kv-v2
        vault kv put secret/db_credentials username=myuser password=mypassword
        echo "Секреты успешно загружены в Vault!"

  zookeeperserver:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafkabroker:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeperserver
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeperserver:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafkabroker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  modelapp:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - kafkabroker
    environment:
      KAFKA_BROKER: "kafkabroker:29092"

  consumerapp:
    build: .
    command: ["python", "-u", "consumer.py"]
    depends_on:
      vaultinit:
        condition: service_completed_successfully
      pgdatabase:
        condition: service_healthy
      kafkabroker:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: 1
      VAULT_ADDR: "http://vaultserver:8200"
      VAULT_TOKEN: "myroot"
      DB_HOST: "pgdatabase"
      POSTGRES_DB: "mydb"
      KAFKA_BROKER: "kafkabroker:29092"